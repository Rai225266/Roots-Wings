<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | Roots & Wings</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/dashboard.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.3/chart.umd.min.js"></script>
</head>
<body data-page="admin">

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <main class="main-panel">
    <div class="topbar" id="topbar"></div>
    <div class="page-content">

      <div class="grid grid-4 mb-3" id="analytics-cards"></div>

      <div class="grid grid-2 mb-3">
        <div class="card"><h3 style="font-size:1rem;" class="mb-2">Signups (Last 6 Months)</h3><canvas id="signup-chart" height="180"></canvas></div>
        <div class="card"><h3 style="font-size:1rem;" class="mb-2">Alumni by Industry</h3><canvas id="industry-chart" height="180"></canvas></div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="users">Manage Users</button>
        <button class="tab-btn" data-tab="jobs">Manage Jobs</button>
        <button class="tab-btn" data-tab="events">Manage Events</button>
        <button class="tab-btn" data-tab="messages">Contact Messages</button>
      </div>

      <div id="tab-users">
        <div class="toolbar">
          <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input class="form-control" id="user-search" placeholder="Search users by name or email..."></div>
          <select class="form-control filter-select" id="user-role-filter"><option value="">All Roles</option><option value="student">Students</option><option value="alumni">Alumni</option><option value="admin">Admins</option></select>
        </div>
        <div class="table-wrap card">
          <table class="data-table">
            <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="users-tbody"></tbody>
          </table>
        </div>
        <div class="pagination" id="users-pagination"></div>
      </div>

      <div id="tab-jobs" style="display:none;">
        <div class="table-wrap card"><table class="data-table"><thead><tr><th>Title</th><th>Company</th><th>Posted By</th><th>Status</th><th>Posted</th></tr></thead><tbody id="jobs-tbody"></tbody></table></div>
      </div>

      <div id="tab-events" style="display:none;">
        <div class="table-wrap card"><table class="data-table"><thead><tr><th>Title</th><th>Type</th><th>Created By</th><th>Date</th><th>Status</th></tr></thead><tbody id="events-tbody"></tbody></table></div>
      </div>

      <div id="tab-messages" style="display:none;">
        <div class="table-wrap card"><table class="data-table"><thead><tr><th>Name</th><th>Email</th><th>Subject</th><th>Message</th><th>Received</th></tr></thead><tbody id="messages-tbody"></tbody></table></div>
      </div>

    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
