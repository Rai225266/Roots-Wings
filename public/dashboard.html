<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Roots & Wings</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/dashboard.css">
</head>
<body data-page="dashboard">

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <main class="main-panel">
    <div class="topbar" id="topbar"></div>
    <div class="page-content">

      <div id="welcome-banner" class="card mb-3" style="background: linear-gradient(120deg, var(--root-100), var(--wing-100)); border-color: transparent;"></div>

      <div class="grid grid-4 mb-3" id="stat-cards"></div>

      <!-- ALUMNI-ONLY QUICK ACTIONS -->
      <div id="alumni-quick-actions" class="card mb-3" style="display:none;">
        <div class="section-title-row"><h3>Quick Actions</h3></div>
        <div class="quick-actions-row">
          <button class="quick-action-btn" id="open-post-job"><i class="fa-solid fa-briefcase"></i> Post a Job</button>
          <button class="quick-action-btn" id="open-post-internship"><i class="fa-solid fa-laptop-code"></i> Post Internship</button>
          <button class="quick-action-btn" id="open-create-event"><i class="fa-solid fa-calendar-plus"></i> Create Event</button>
          <a href="/messages.html" class="quick-action-btn"><i class="fa-solid fa-comments"></i> Messages</a>
        </div>
      </div>

      <div class="grid" style="grid-template-columns: 1.6fr 1fr; align-items:start; gap:24px;">
        <!-- MAIN COLUMN: Alumni Feed -->
        <div>
          <div class="card mb-3" id="feed-composer-card">
            <div class="flex gap-2" style="align-items:flex-start;">
              <div id="composer-avatar"></div>
              <form id="post-form" style="flex:1;">
                <textarea class="form-control" name="content" placeholder="Share an update, an opportunity, or advice with the community..." required></textarea>
                <div class="flex-between mt-2">
                  <input class="form-control" name="tags" placeholder="Tags (comma separated) e.g. Career Advice, Mentorship" style="max-width:320px;">
                  <button type="submit" class="btn btn-primary btn-sm">Post</button>
                </div>
              </form>
            </div>
          </div>

          <div class="card">
            <div class="section-title-row"><h3>Feed</h3></div>
            <div id="feed-list"><div class="loading-state"><span class="spinner"></span>Loading feed...</div></div>
            <div class="text-center mt-2">
              <button class="btn btn-outline btn-sm" id="load-more-feed" style="display:none;">Load more</button>
            </div>
          </div>
        </div>

        <!-- SIDE COLUMN -->
        <div>
          <div class="card mb-3">
            <div class="section-title-row"><h3>Upcoming Events</h3><a href="/events.html">View all →</a></div>
            <div id="upcoming-events-list"><div class="loading-state"><span class="spinner"></span></div></div>
          </div>

          <div class="card mb-3">
            <div class="section-title-row"><h3>Trending Companies</h3></div>
            <div id="trending-companies-list"><div class="loading-state"><span class="spinner"></span></div></div>
          </div>

          <!-- STUDENT-ONLY -->
          <div id="student-side-widgets" style="display:none;">
            <div class="card mb-3">
              <div class="section-title-row"><h3>My Applications</h3><a href="/jobs.html">View all →</a></div>
              <div id="my-applications-list"><div class="loading-state"><span class="spinner"></span></div></div>
            </div>
            <div class="card">
              <div class="section-title-row"><h3>My Mentors</h3></div>
              <div id="my-mentors-list"><div class="loading-state"><span class="spinner"></span></div></div>
            </div>
          </div>

          <!-- ALUMNI-ONLY -->
          <div id="alumni-side-widgets" style="display:none;">
            <div class="card mb-3">
              <div class="section-title-row"><h3>Mentorship Requests</h3></div>
              <div id="mentor-requests-list"><div class="loading-state"><span class="spinner"></span></div></div>
            </div>
            <div class="card">
              <div class="section-title-row"><h3>Active Mentees</h3></div>
              <div id="active-mentees-list"><div class="loading-state"><span class="spinner"></span></div></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- Post Job Modal -->
<div class="modal-overlay" id="job-modal">
  <div class="modal" style="position:relative; max-width:600px;">
    <button class="modal-close" data-close="job-modal"><i class="fa-solid fa-xmark"></i></button>
    <h3>Post a Job</h3>
    <form id="job-form">
      <div class="form-row">
        <div class="form-group"><label>Job Title</label><input class="form-control" name="title" required></div>
        <div class="form-group"><label>Company</label><input class="form-control" name="company" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Location</label><input class="form-control" name="location"></div>
        <div class="form-group"><label>Job Type</label>
          <select class="form-control" name="job_type"><option value="full-time">Full-time</option><option value="part-time">Part-time</option><option value="contract">Contract</option><option value="remote">Remote</option></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Experience Required</label><input class="form-control" name="experience_required" placeholder="0-2 years"></div>
        <div class="form-group"><label>Salary Range</label><input class="form-control" name="salary_range" placeholder="₹6-10 LPA"></div>
      </div>
      <div class="form-group"><label>Description</label><textarea class="form-control" name="description" required></textarea></div>
      <div class="form-group"><label>Skills Required (comma separated)</label><input class="form-control" name="skills_required" placeholder="JavaScript, React, CSS"></div>
      <div class="form-group"><label>Last Date to Apply</label><input class="form-control" type="date" name="last_date_to_apply"></div>
      <button type="submit" class="btn btn-primary btn-block">Post Job</button>
    </form>
  </div>
</div>

<!-- Post Internship Modal -->
<div class="modal-overlay" id="internship-modal">
  <div class="modal" style="position:relative; max-width:600px;">
    <button class="modal-close" data-close="internship-modal"><i class="fa-solid fa-xmark"></i></button>
    <h3>Post an Internship</h3>
    <form id="internship-form">
      <div class="form-row">
        <div class="form-group"><label>Title</label><input class="form-control" name="title" required></div>
        <div class="form-group"><label>Company</label><input class="form-control" name="company" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Location</label><input class="form-control" name="location"></div>
        <div class="form-group"><label>Mode</label>
          <select class="form-control" name="mode"><option value="remote">Remote</option><option value="onsite">Onsite</option><option value="hybrid">Hybrid</option></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Duration</label><input class="form-control" name="duration" placeholder="3 months"></div>
        <div class="form-group"><label>Stipend</label><input class="form-control" name="stipend" placeholder="₹15,000/month"></div>
      </div>
      <div class="form-group"><label>Description</label><textarea class="form-control" name="description" required></textarea></div>
      <div class="form-group"><label>Skills Required (comma separated)</label><input class="form-control" name="skills_required"></div>
      <div class="form-group"><label>Last Date to Apply</label><input class="form-control" type="date" name="last_date_to_apply"></div>
      <button type="submit" class="btn btn-gold btn-block">Post Internship</button>
    </form>
  </div>
</div>

<!-- Create Event Modal -->
<div class="modal-overlay" id="event-modal">
  <div class="modal" style="position:relative; max-width:600px;">
    <button class="modal-close" data-close="event-modal"><i class="fa-solid fa-xmark"></i></button>
    <h3>Create an Event</h3>
    <form id="event-form">
      <div class="form-group"><label>Event Title</label><input class="form-control" name="title" required></div>
      <div class="form-group"><label>Description</label><textarea class="form-control" name="description"></textarea></div>
      <div class="form-row">
        <div class="form-group"><label>Event Type</label>
          <select class="form-control" name="event_type"><option value="webinar">Webinar</option><option value="meetup">Meetup</option><option value="workshop">Workshop</option><option value="networking">Networking</option><option value="other">Other</option></select>
        </div>
        <div class="form-group"><label>Max Participants</label><input class="form-control" type="number" name="max_participants" placeholder="0 = unlimited"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Date</label><input class="form-control" type="date" name="event_date" required></div>
        <div class="form-group"><label>Time</label><input class="form-control" type="time" name="event_time"></div>
      </div>
      <div class="form-group"><label>Location / Meeting Link</label><input class="form-control" name="location" placeholder="Online or venue address"></div>
      <button type="submit" class="btn btn-outline btn-block">Create Event</button>
    </form>
  </div>
</div>

<!-- Schedule Session Modal (mentorship) -->
<div class="modal-overlay" id="session-modal">
  <div class="modal" style="position:relative;">
    <button class="modal-close" data-close="session-modal"><i class="fa-solid fa-xmark"></i></button>
    <h3>Schedule a Session</h3>
    <form id="session-form">
      <input type="hidden" name="mentorship_id">
      <div class="form-group"><label>Date &amp; Time</label><input class="form-control" type="datetime-local" name="session_date" required></div>
      <div class="form-group"><label>Topic</label><input class="form-control" name="topic" placeholder="e.g. Resume review, mock interview, doubt session"></div>
      <div class="form-group"><label>Meeting Link (optional)</label><input class="form-control" name="session_link" placeholder="https://meet.google.com/..."></div>
      <div class="form-group"><label>Notes (optional)</label><textarea class="form-control" name="notes"></textarea></div>
      <button type="submit" class="btn btn-primary btn-block">Schedule Session</button>
    </form>
  </div>
</div>

<!-- View Sessions Modal -->
<div class="modal-overlay" id="sessions-list-modal">
  <div class="modal" style="position:relative;">
    <button class="modal-close" data-close="sessions-list-modal"><i class="fa-solid fa-xmark"></i></button>
    <h3>Session History</h3>
    <div id="sessions-list-body"></div>
  </div>
</div>

<!-- Post Comments Modal -->
<div class="modal-overlay" id="comments-modal">
  <div class="modal" style="position:relative;">
    <button class="modal-close" data-close="comments-modal"><i class="fa-solid fa-xmark"></i></button>
    <h3>Comments</h3>
    <div id="comments-list" class="feed-comments" style="margin-bottom:16px;"></div>
    <form id="comment-form" class="flex gap-1">
      <input type="hidden" name="post_id">
      <input class="form-control" name="comment" placeholder="Add a comment..." required>
      <button type="submit" class="btn btn-primary btn-sm">Send</button>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
