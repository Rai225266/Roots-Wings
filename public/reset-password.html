<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Roots & Wings</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/auth.css">
</head>
<body data-page="reset">

<div class="auth-wrap">
  <div class="auth-side">
    <div class="auth-orb"></div>
    <a href="/" class="brand"><img src="/images/logo-mark.png" class="brand-icon-logo" alt="Roots & Wings">Roots &amp; Wings</a>
    <div>
      <h2>Almost there.</h2>
      <p>Choose a new password to get back into your account.</p>
    </div>
  </div>

  <div class="auth-main">
    <div class="auth-card">
      <a href="/" class="brand mobile-brand"><img src="/images/logo-mark.png" class="brand-icon-logo" alt="Roots & Wings">Roots &amp; Wings</a>
      <h1>Set a new password</h1>
      <p class="sub">Make sure it's at least 6 characters.</p>

      <form id="reset-form">
        <div class="form-group">
          <label>New Password</label>
          <div class="password-field"><input class="form-control" type="password" name="password" minlength="6" required><button type="button" class="toggle-eye"><i class="fa-solid fa-eye"></i></button></div>
        </div>
        <div class="form-group">
          <label>Confirm New Password</label>
          <div class="password-field"><input class="form-control" type="password" name="confirm_password" minlength="6" required><button type="button" class="toggle-eye"><i class="fa-solid fa-eye"></i></button></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
      </form>

      <p class="auth-foot"><a href="/login.html">Back to login</a></p>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
